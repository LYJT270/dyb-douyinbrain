name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + $env:Path
            (Split-Path -Parent (Get-Command ffmpeg).Source) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Validate source and checked-in manifest
        run: python -B scripts/check_release.py
      - name: Offline behavioral tests (no speech API)
        run: python -B -X utf8 -m unittest discover -s tests
      - name: Install into a fresh isolated workspace and deliver existing text
        shell: powershell
        run: |
          $dyPython = (Get-Command python).Source
          & ./scripts/smoke_install.ps1 -PythonExecutable $dyPython
      - name: Build verified installation ZIP
        run: python -B -X utf8 scripts/package.py --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installation-package
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ' }
          python -B -X utf8 scripts/package.py --output-dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Package failed' }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --verify-tag --title "抖音脑 Douyin-brain $version" --notes-file "docs/releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release failed; inspect existing release before retrying' }
