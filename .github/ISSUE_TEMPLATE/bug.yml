name: Bug report / 问题反馈
description: Report a reproducible problem without credentials or private media.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Please remove API keys, cookies and private content. 请勿上传 Key、Cookie 或个人素材。'
  - type: input
    id: version
    attributes:
      label: Version and Agent / 版本与 Agent
      placeholder: v1.0.0, Windows 11, DeepSeek Harness
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / 复现步骤与预期
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: Include the stage and error text, with personal paths and sensitive values removed.
    validations:
      required: true
